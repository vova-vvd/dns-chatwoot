map $host $cors_allow_origin {
    default "https://adnull.com";
    #"https://docs.adnull.com";
}

# Microcache for the public Help Center (/hc/) responses.
proxy_cache_path /var/cache/nginx/hc levels=1:2 keys_zone=hc:10m max_size=500m inactive=10m use_temp_path=off;

# Internal Passenger origin so the public server can proxy_cache /hc/ requests
# (proxy_cache cannot be used with passenger_enabled directly).
server {
    listen 127.0.0.1:8080;
    server_name _;

    root /home/deploy/chatwoot/public;
    passenger_enabled on;
    passenger_ruby /usr/share/rvm/gems/ruby-3.4.4@chatwoot/wrappers/ruby;
    client_max_body_size 20M;

    location /cable {
        passenger_app_group_name donateraiser_action_cable;
        passenger_force_max_concurrent_requests_per_process 0;
    }
}

server {
    server_name docs.adnull.com www.docs.adnull.com;

    if ($host = www.docs.adnull.com) {
      return 301 https://docs.adnull.com$request_uri;
    }

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4;

    # Tell Nginx and Passenger where your app's 'public' directory is
    root /home/deploy/chatwoot/public;

    # CORS
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Expose-Headers "ETag, Last-Modified, Cache-Control, Content-Type" always;
    add_header Vary "Origin" always;

    # Turn on Passenger
    passenger_enabled on;
    passenger_ruby /usr/share/rvm/gems/ruby-3.4.4@chatwoot/wrappers/ruby;
    #passenger_sticky_sessions on;
    client_max_body_size 20M;

    # Cable config
    location /cable {
        passenger_app_group_name donateraiser_action_cable;
        passenger_force_max_concurrent_requests_per_process 0;
    }

    # Tracking pixel must hit the app every time so view counts increment.
    # Regex location is matched before the /hc/ prefix, and it falls through to
    # the server-level Passenger (no proxy_pass, no caching).
    location ~ ^/hc/[^/]+/articles/.+\.png$ {
    }

    # Public Help Center pages: microcached via the loopback Passenger origin.
    location /hc/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache hc;
        proxy_cache_key $scheme$host$request_uri;   # query (theme/locale/show_plain_layout) => per-variant
        proxy_cache_valid 200 60s;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;               # never share _chatwoot_session via the shared cache
        proxy_cache_revalidate on;                  # cheap upstream 304s via the stored ETag
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        # add_header inside a location drops inherited ones, so re-declare CORS:
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Access-Control-Expose-Headers "ETag, Last-Modified, Cache-Control, Content-Type" always;
        add_header Vary "Origin" always;
        add_header X-Cache-Status $upstream_cache_status;
    }



    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/docs.adnull.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/docs.adnull.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.docs.adnull.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host ~ ^[^.]+\.docs.adnull\.com$) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = docs.adnull.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name docs.adnull.com www.docs.adnull.com;
    listen 80;
    return 404; # managed by Certbot



}

server {
    if ($host = docs.adnull.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name docs.adnull.com www.docs.adnull.com;
    listen 80;
    return 404; # managed by Certbot
}
